name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx
        if [ -f requirements/runtime.txt ]; then pip install -r requirements/runtime.txt; fi
        if [ -f requirements/dev.txt ]; then pip install -r requirements/dev.txt; fi

    # 🔹 خطوة توليد أو تدريب النموذج والـ Artifacts قبل الاختبارات (عدلي الأمر بحسب سكربت المشروع لديكِ)
    - name: Generate Model Artifacts
      env:
        PYTHONPATH: .
      run: |
        python src/train.py   # أو السكربت المسؤول عن إنشاء data/artifacts/

    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: |
        pytest

    - name: Build Docker Image
      run: |
        docker build -t qafzah-mlops-api:latest .
